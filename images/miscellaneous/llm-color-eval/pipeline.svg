<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" font-family="sans-serif"><rect width="880" height="240" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker></defs><rect x="20" y="70" width="80" height="80" rx="12" fill="#3fa76e"/><text x="60" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">#3fa76e</text><text x="60" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">the color</text><line x1="108" y1="110" x2="152" y2="110" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="158" y="80" width="120" height="60" rx="10" fill="#ffffff" stroke="#d5d4d0" stroke-width="1.5"/><text x="218" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">describer</text><text x="218" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">(LLM)</text><line x1="286" y1="110" x2="330" y2="110" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/><rect x="332" y="62" width="228" height="96" rx="10" fill="#ffffff" stroke="#d5d4d0" stroke-width="1.5"/><text x="446" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400">“medium-toned, fresh grass-green</text><text x="446" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="400">with a slight blue undertone…”</text><text x="446" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">no hex, no RGB, no numbers</text><line x1="560" y1="110" x2="604" y2="110" stro